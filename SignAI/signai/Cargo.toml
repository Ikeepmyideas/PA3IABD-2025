[package]
name = "signai"
version = "0.1.0"
edition = "2021"

[lib]
name = "mymodel"
crate-type = ["cdylib"]

[dependencies]
image = "0.24"
walkdir = "2.4"
csv = "1.3"
rand = "0.8"

# ndarray = "0.15"
# ndarray-linalg = { version = "0.16", features = ["intel-mkl-static"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

nalgebra = { version = "0.32", features = ["serde-serialize"] }
[package.metadata.vcpkg]
dependencies = ["openblas"]
