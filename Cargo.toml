[package]
name = "mymodel"
version = "0.1.0"
edition = "2021"

[lib]
name = "mymodel"
crate-type = ["cdylib"]

[dependencies]
image = "0.24"
walkdir = "2.4"
csv = "1.3"
rand = "0.8"
pyo3 = { version = "0.25.1", features = ["extension-module"] }
rand_distr = "0.4"
serde_json = "1.0.141"

nalgebra = { version = "0.32", features = ["serde-serialize"] }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
rayon = "1.10.0"
# ndarray = "0.15"
# ndarray-linalg = { version = "0.16", features = ["intel-mkl-static"] }

[package.metadata.vcpkg]
dependencies = ["openblas"]
